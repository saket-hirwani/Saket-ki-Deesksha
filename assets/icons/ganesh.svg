<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Sacred Lord Ganesha Icon for Luxury Indian Wedding Invitation -->
  <defs>
    <linearGradient id="ganeshGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C776" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7428" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#C5A059" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aura Halo -->
  <circle cx="60" cy="58" r="54" fill="url(#haloGlow)" />
  <circle cx="60" cy="58" r="48" stroke="url(#ganeshGold)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Sacred Ganesh Form (Classical Calligraphic & Iconic Outline) -->
  <g stroke="url(#ganeshGold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Mukut / Crown -->
    <path d="M52 20 L60 12 L68 20 L65 26 L55 26 Z" fill="#FAF4EA" fill-opacity="0.6" />
    <path d="M60 12 L60 26" stroke-width="1.2" />
    <circle cx="60" cy="11" r="2" fill="url(#ganeshGold)" />

    <!-- Forehead / Head outline with auspicious curvature -->
    <path d="M44 38 C44 26 52 26 60 26 C68 26 76 26 76 38" />

    <!-- Auspicious Tilak on Forehead -->
    <path d="M58 29 Q60 36 62 29" stroke="#8C232C" stroke-width="1.8" />
    <circle cx="60" cy="33" r="1.4" fill="#8C232C" />

    <!-- Left Ear (Grand Royal Curve) -->
    <path d="M44 38 C32 38 27 46 27 57 C27 68 36 71 45 68" />
    <path d="M34 50 C31 54 32 61 38 63" stroke-width="1.2" opacity="0.7" />

    <!-- Right Ear / Trident Side -->
    <path d="M76 38 C88 38 93 46 93 57 C93 68 84 71 75 68" />
    <path d="M86 50 C89 54 88 61 82 63" stroke-width="1.2" opacity="0.7" />

    <!-- Divine Eyes & Brows -->
    <path d="M48 42 Q52 40 56 43" stroke-width="1.5" />
    <path d="M64 43 Q68 40 72 42" stroke-width="1.5" />
    <circle cx="52" cy="44" r="1" fill="url(#ganeshGold)" />
    <circle cx="68" cy="44" r="1" fill="url(#ganeshGold)" />

    <!-- Left Tusk (Broken Tusk - Ekdanta) -->
    <path d="M51 55 L47 57" stroke-width="2" stroke-linecap="butt" />

    <!-- Right Tusk (Full Sacred Tusk) -->
    <path d="M69 55 L75 60" stroke-width="2" />

    <!-- Iconic Trunk (Vakratunda curving gracefully to the left with modak) -->
    <path d="M58 44 C58 56 65 65 65 74 C65 85 54 89 48 84 C43 80 44 73 50 71 C54 69 56 73 54 75 C52 77 49 76 49 74" stroke-width="2.6" />

    <!-- Sacred Modak (Sweet of Blessing) in trunk hand -->
    <circle cx="43" cy="74" r="3.5" fill="url(#ganeshGold)" stroke="#8C232C" stroke-width="1" />

    <!-- Auspicious Abhaya Mudra / Blessing Hand (Right) -->
    <path d="M76 68 C80 69 84 73 83 78 C82 82 77 84 73 82" stroke-width="1.8" />
    <circle cx="78" cy="76" r="1.2" fill="#8C232C" />

    <!-- Sacred Lotus Pedestal Base Lines -->
    <path d="M38 96 C48 93 72 93 82 96" stroke-width="1.6" />
    <path d="M44 100 C52 98 68 98 76 100" stroke-width="1.2" />
    <circle cx="60" cy="98" r="1.5" fill="url(#ganeshGold)" />
  </g>
</svg>
